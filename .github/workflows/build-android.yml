name: Build RedApp APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "RedApp-android-project.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract native Android project
        run: |
          mkdir -p build-source
          unzip -q RedApp-android-project.zip -d build-source
          test -f build-source/android/settings.gradle.kts
          test -f build-source/android/app/build.gradle.kts
          cp build-source/android/local.properties.example build-source/android/local.properties
          sed -i "s#sdk.dir=.*#sdk.dir=$ANDROID_HOME#" build-source/android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: build-source/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RedApp-debug-apk
          path: build-source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
